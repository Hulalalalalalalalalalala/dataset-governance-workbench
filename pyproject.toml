[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-governance-workbench"
version = "0.1.0"
description = "A local, versioned dataset governance workbench"
requires-python = ">=3.11"

[project.scripts]
dataset-governance = "governance_workbench.cli:main"
